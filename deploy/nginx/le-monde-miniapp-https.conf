server {
    listen 80;
    listen [::]:80;

    server_name 31.77.206.19;
    root /var/www/le-monde-miniapp;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name 31.77.206.19;
    root /var/www/le-monde-miniapp;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/31.77.206.19/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/31.77.206.19/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
